<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabrielzv1233 - Projects</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Source Code Pro', monospace;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #181818;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    header {
      text-align: center;
      padding: 0;
      margin-bottom: 0px;
      margin-top: 10px;
      color: #f0f0f0;
    }

    .center-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 50px);
      width: 100%;
      padding: 0px;
      overflow: hidden;
    }

    #container {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0px;
      height: 100%;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
    }

    button {
      display: block;
      flex-shrink: 0;
      width: 325px;
      height: 90%;
      margin: 0 5px;
      border: 1px solid #3D3D3D;
      border-radius: 10px;
      outline: 1px solid #3D3D3D;
      background-color: #212121;
      color: #AFAFAF;
      font-size: 125%;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
      scroll-snap-align: center;
    }

    button:hover {
      transform: scale(1.1);
    }

    button:active {
      transform: scale(1);
    }

    html, body {
      scroll-behavior: smooth;
    }

    body::-webkit-scrollbar {
      height: 8px;
    }

    body::-webkit-scrollbar-thumb {
      background-color: lightgray;
      border-radius: 4px;
    }

    body::-webkit-scrollbar-track {
      background: white;
    }

    @media (max-width: 1080px) {
      button {
        width: 150px;
        height: 67.5%;
      }
      #container {
        margin-top: -30px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>C:\Users\Gabriel\Projects</h1>
  </header>
  <div class="center-container">
    <div id="container">
      <button onclick="window.location.href = 'https://github.com/gabrielzv1233/msgr'">msgr v2</button>
      <button onclick="window.location.href = 'https://github.com/gabrielzv1233/TransferIt'">Transfer It</button>
      <button onclick="window.location.href = '/">Back Home</button>
      <button onclick="window.location.href = 'https://github.com/gabrielzv1233/JewFuss-XT'">JewFuss-XT</button>
      <button onclick="window.location.href = 'https://swaws.dev/'">SWAWS.DEV</button>
    </div>
  </div>

  <script>
    const container = document.getElementById('container');

    window.addEventListener('load', () => {
      const buttonCount = container.children.length;
      const buttonWidth = container.children[0].offsetWidth + 10; // Include gap
      const containerWidth = document.querySelector('.center-container').offsetWidth;

      // Center the buttons dynamically
      const totalContentWidth = buttonCount * buttonWidth;
      if (totalContentWidth < containerWidth) {
        container.style.justifyContent = 'center';
      } else {
        const middleIndex = Math.floor(buttonCount / 2);
        const offset = middleIndex * buttonWidth - (containerWidth / 2 - buttonWidth / 2);
        container.scrollTo({
          left: Math.max(0, offset),
          behavior: 'smooth',
        });
      }
    });

    document.addEventListener('wheel', (event) => {
      event.preventDefault();
      const direction = event.deltaY > 0 ? 1 : -1;
      const buttonWidth = container.children[0].offsetWidth + 10;
      container.scrollBy({
        left: direction * buttonWidth,
        behavior: 'smooth',
      });
    });

    container.addEventListener('touchstart', (e) => {
      this.startX = e.touches[0].pageX;
    });

    container.addEventListener('touchend', (e) => {
      const endX = e.changedTouches[0].pageX;
      const direction = endX < this.startX ? 1 : -1;
      const buttonWidth = container.children[0].offsetWidth + 10;
      container.scrollBy({
        left: direction * buttonWidth,
        behavior: 'smooth',
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'a') {
        const newButton = document.createElement('button');
        newButton.textContent = `Button ${container.children.length + 1}`;
        container.appendChild(newButton);
      }
    });
  </script>
</body>
</html>
